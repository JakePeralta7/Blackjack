services:
  blackjack:
    image: ghcr.io/jakeperalta7/blackjack:latest
    ports:
      - "3001:3000"
    volumes:
      - blackjack-data:/data
    environment:
      NODE_ENV: production
      DB_PATH: /data/blackjack.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/leaderboard?deck_count=1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  blackjack-data:
